<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attacker Agent — Attack Surface Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --panel: #fff; --panel2: #faf9f7; --border: #eae5df;
    --text: #29241f; --muted: #756b61; --accent: #c44b0a;
    --red: #a33b12; --green: #436148; --amber: #965507;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 30px 36px 24px; border-top: 4px solid var(--accent); border-bottom: 1px solid var(--border); }
  .heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .eyebrow { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  header h1 { font-size: 27px; letter-spacing: -.8px; line-height: 1.3; margin: 4px 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 13px; }
  .controls { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 650; color: var(--muted); }
  input { background: #fff; border: 1px solid #dcd4cc; color: var(--text); padding: 10px 12px; border-radius: 7px; font: inherit; height: 42px; }
  input#target { width: 320px; } input#model { width: 160px; }
  input:focus { border-color: var(--accent); outline: 3px solid #ffeddc; }
  button { background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 10px 18px; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; min-height: 42px; transition: background .15s; }
  button:hover { background: #a83e05; }
  button:focus-visible { outline: 3px solid #e8a878; outline-offset: 3px; }
  button:disabled { background: #eee8e1; color: #817468; border-color: #eee8e1; cursor: not-allowed; }
  button.secondary { background: #fff; border-color: var(--border); color: var(--muted); }
  button.secondary:hover { background: var(--panel2); color: var(--text); }
  .status { font-size: 12px; padding: 6px 11px; border-radius: 6px; font-weight: 600; max-width: 45%; overflow-wrap: anywhere; }
  .status.idle { background: #f5f3f0; color: var(--muted); }
  .status.running { background: #fff0e3; color: var(--accent); }
  .status.running::before { content: "● "; animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  main { display: grid; grid-template-columns: minmax(240px, .9fr) minmax(340px, 1.55fr) minmax(260px, 1fr); gap: 20px; padding: 24px 36px 36px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; min-width: 0; }
  .panel h2 { font-size: 13px; font-weight: 650; color: var(--text); margin: 0; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .panel h2::before { content: ""; display: inline-block; width: 4px; height: 13px; border-radius: 2px; background: #e97829; margin-right: 9px; vertical-align: -2px; }
  .panel .body { max-height: 65vh; overflow: auto; scrollbar-width: thin; scrollbar-color: #d8cec3 transparent; }
  .rounds { display: flex; gap: 8px; padding: 20px 36px 0; flex-wrap: wrap; }
  .rounds:empty { display: none; }
  .round-chip { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 12px; background: #fffcf9; color: var(--muted); }
  .round-chip b { color: var(--text); }
  .round-chip .v { color: var(--red); } .round-chip .d { color: var(--green); } .round-chip .i { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 14px 12px; border-bottom: 1px solid #f0ece7; text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fffcf9; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .ep-path { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .method { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 4px; background: #fff0e3; color: var(--accent); }
  .verdict { display: inline-block; font-weight: 650; font-size: 10px; padding: 3px 7px; border-radius: 4px; white-space: nowrap; }
  .verdict.true { background: #fff0e3; color: var(--red); }
  .verdict.false { background: #eef3ed; color: var(--green); }
  .verdict.null { background: #f2efeb; color: var(--muted); }
  .finding-title { font-weight: 600; line-height: 1.5; }
  .finding-owasp { color: var(--muted); font-size: 11px; margin-top: 4px; overflow-wrap: anywhere; }
  .evidence { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #65594e; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 90px; overflow-y: auto; background: var(--panel2); padding: 9px 10px; border-left: 2px solid #eac7a9; border-radius: 0 4px 4px 0; }
  .log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 4px 16px; overflow-wrap: anywhere; }
  .log .row { padding: 10px 0; border-bottom: 1px solid #f0ece7; }
  .log .src { color: var(--accent); font-weight: 650; }
  .log .src.orchestrator { color: var(--muted); }
  .log .msg.warn { color: var(--amber); }
  .log .ts { color: var(--muted); margin-right: 6px; }
  .empty { color: var(--muted); padding: 32px 18px; font-size: 13px; }
  @media (min-width: 1700px) { header, main, .rounds { padding-left: max(36px, calc((100vw - 1700px)/2)); padding-right: max(36px, calc((100vw - 1700px)/2)); } }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); } .panel:last-child { grid-column: 1 / -1; } .panel:last-child .body { max-height: 320px; } }
  @media (max-width: 700px) { header { padding: 22px 18px; } .heading { align-items: start; } header h1 { font-size: 23px; } main { grid-template-columns: minmax(0, 1fr); padding: 18px; gap: 16px; } .rounds { padding: 18px 18px 0; } .field { width: 100%; } input#target, input#model { width: 100%; } .status { max-width: 35%; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="heading">
    <div>
      <div class="eyebrow">Agentic ASM</div>
      <h1>Attack surface dashboard</h1>
      <div class="sub">Discover endpoints, review findings, and follow each round.</div>
    </div>
    <span id="statusPill" class="status idle" role="status">idle</span>
  </div>
  <div class="controls">
    <div class="field"><label for="target">Target URL</label><input id="target" value="__DEFAULT_TARGET__" spellcheck="false"></div>
    <div class="field"><label for="model">Ollama model</label><input id="model" value="__DEFAULT_MODEL__" spellcheck="false"></div>
    <button id="runBtn" onclick="runRound()">Run round</button>
    <button class="secondary" onclick="resetState()">Reset state</button>
  </div>
</header>

<div class="rounds" id="rounds"></div>

<main>
  <div class="panel">
    <h2>Attack Surface</h2>
    <div class="body" id="surface"><div class="empty">no data yet — run a round</div></div>
  </div>

  <div class="panel">
    <h2>Findings</h2>
    <div class="body" id="findings"><div class="empty">no findings yet — run a round</div></div>
  </div>

  <div class="panel">
    <h2>Live log</h2>
    <div class="body log" id="log"><div class="empty">idle</div></div>
  </div>
</main>

<script>
const OWASP_SHORT = s => (s || "").split(" ")[0];

async function poll() {
  let res;
  try { res = await fetch("/api/state"); } catch (e) { return; }
  if (!res.ok) return;
  const state = await res.json();
  renderStatus(state.running);
  renderRounds(state.rounds);
  renderSurface(state.attack_surface);
  renderFindings(state.findings);
  renderLog(state.events);
}

function renderStatus(running) {
  const pill = document.getElementById("statusPill");
  const btn = document.getElementById("runBtn");
  if (running && running.active) {
    pill.textContent = "running: " + running.target;
    pill.className = "status running";
    btn.disabled = true;
  } else {
    pill.textContent = running && running.error ? "error: " + running.error : "idle";
    pill.className = "status idle";
    btn.disabled = false;
  }
}

function renderRounds(rounds) {
  const el = document.getElementById("rounds");
  if (!rounds || !rounds.length) { el.innerHTML = ""; return; }
  el.innerHTML = rounds.slice().reverse().map(r => `
    <div class="round-chip">
      <b>Round ${r.round}</b> · ${r.status}
      ${r.status === "done" ? `— <span class="v">${r.vulnerable ?? 0} vulnerable</span>, <span class="d">${r.defended ?? 0} defended</span>, <span class="i">${r.inconclusive ?? 0} inconclusive</span>` : ""}
    </div>`).join("");
}

function renderSurface(surface) {
  const el = document.getElementById("surface");
  if (!surface || !surface.endpoints || !surface.endpoints.length) {
    el.innerHTML = '<div class="empty">no data yet — run a round</div>'; return;
  }
  el.innerHTML = `<table><tbody>` + surface.endpoints.map(e => `
    <tr>
      <td><span class="method">${e.method}</span></td>
      <td>
        <div class="ep-path">${escapeHtml(e.path)}</div>
        <div class="finding-owasp">${escapeHtml(e.summary || "")}${e.auth_required ? " · auth required" : ""}</div>
      </td>
    </tr>`).join("") + `</tbody></table>`;
}

function verdictLabel(v) { return v === true ? "VULNERABLE" : v === false ? "defended" : "inconclusive"; }

function renderFindings(findings) {
  const el = document.getElementById("findings");
  const list = Object.values(findings || {});
  if (!list.length) { el.innerHTML = '<div class="empty">no findings yet — run a round</div>'; return; }
  list.sort((a, b) => (b.verdict === true) - (a.verdict === true));
  el.innerHTML = `<table><tbody>` + list.map(f => `
    <tr>
      <td><span class="verdict ${f.verdict}">${verdictLabel(f.verdict)}</span></td>
      <td>
        <div class="finding-title">${escapeHtml(f.title)}</div>
        <div class="finding-owasp">${escapeHtml(f.owasp)} · ${escapeHtml(f.target || 'legacy target unknown')} · ${f.kind} · round ${f.last_round} · ${f.status}</div>
        <div class="evidence">${escapeHtml(typeof f.evidence === 'object' ? JSON.stringify(f.evidence, null, 2) : (f.evidence || '').toString())}</div>
      </td>
    </tr>`).join("") + `</tbody></table>`;
}

function renderLog(events) {
  const el = document.getElementById("log");
  if (!events || !events.length) { el.innerHTML = '<div class="empty">idle</div>'; return; }
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
  el.innerHTML = events.map(e => {
    const t = new Date(e.ts * 1000).toLocaleTimeString();
    return `<div class="row"><span class="ts">${t}</span><span class="src ${e.source}">${e.source}</span> <span class="msg ${e.level}">${escapeHtml(e.message)}</span></div>`;
  }).join("");
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
  return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function runRound() {
  const target = document.getElementById("target").value.trim();
  const model = document.getElementById("model").value.trim();
  const res = await fetch("/api/run", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({target, model}) });
  if (!res.ok) { const body = await res.json().catch(() => ({})); alert(body.error || "could not start round"); }
  poll();
}

async function resetState() {
  if (!confirm("Clear all rounds, findings and log history?")) return;
  await fetch("/api/reset", { method: "POST" });
  poll();
}

poll();
setInterval(poll, 1500);
</script>
</body>
</html>
